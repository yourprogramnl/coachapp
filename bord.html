<title>YourProgram · Live bord</title>
<!--
  Live bord (20 nov 2026, wens Stefan): de pagina die op een tv of beamer staat tijdens een
  trainingsdag. Open link met een geheime code (?c=...), zonder inloggen. Haalt elke twee
  seconden de stand op via de functie live_bord_stand: het onderdeel dat de coach nu toont
  en de scores daarbij. Het logo staat vast bovenaan, zodat het op elke foto staat.

  Uitgangspunt (Stefan, 20 nov): wie het bedient moet het zonder uitleg snappen, dus wat
  vanzelf kan gaat vanzelf.
  - De scores deelt het bord zelf in: zo groot mogelijk, mannen en vrouwen apart, Rx boven
    Scaled. Passen ze niet meer leesbaar op één scherm, dan bladert het bord vanzelf door.
  - Instellen kan alleen wat niet vanzelf kan: de lettergrootte en plek van de workout-tekst
    en de verdeling van het scherm. Beweeg de muis (of tik) en linksonder komt een klein
    balkje, naar het voorbeeld van de tv van SugarWOD. Het werkt meteen, geldt alleen voor dit
    scherm (browsergeheugen) en verdwijnt vanzelf, net als de muisaanwijzer.
  Chromecast (20 nov 2026, naar de BoxTV van de CrossFit Capelle app): op /cast (zie vercel.json)
  draait deze pagina op de Chromecast zelf, als Google Cast custom receiver. De YourProgram-app
  op de telefoon zet hem daar neer en stuurt over het kanaal urn:x-cast:nl.yourprogram.bord het
  bericht {type:'bord', code}. Daarna leest de pagina het bord zoals altijd en mag de telefoon
  weg; bedienen gaat via de database (afstandsbediening in de app of de website).
  Bediening en klaarzetten: app/live-bord.js in de coach-app.
-->
<style>
:root{--ink:#0E0E10;--vlak:#17171A;--lijn:#2a2a2e;--goud:#D9B44A;--tekst:#f2f2f2;--zacht:#9a9aa0;--groen:#6fcf8a;--rood:#e5484d;--paars:#b9a2ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--tekst);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
#bord{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{position:relative;text-align:center;padding:1.6vh 3vw 1.2vh;border-bottom:1px solid var(--lijn)}
header img{height:8.5vh;min-height:44px;max-width:80vw;object-fit:contain;display:block;margin:0 auto}
#kop{margin-top:.5vh;font-size:clamp(13px,2.1vh,26px);color:var(--zacht)}
#kop b{color:var(--tekst);font-weight:600}
#live{color:var(--groen);white-space:nowrap}
#live.weg{color:var(--rood)}
#klok{position:absolute;right:3vw;top:50%;transform:translateY(-50%);font-size:clamp(16px,3.6vh,44px);font-variant-numeric:tabular-nums;color:var(--zacht)}
main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.vak{min-height:0;min-width:0;padding:2.2vh 2.4vw;display:flex;flex-direction:column}
main.split .vak+.vak{border-left:1px solid var(--lijn)}
.label{color:var(--goud);font-size:clamp(12px,1.9vh,22px);letter-spacing:.04em;margin-bottom:.8vh;flex:none}
.label.midden{text-align:center}
.titel{font-size:clamp(20px,4.2vh,54px);font-weight:700;line-height:1.15;margin:0 0 1.4vh;flex:none}
.tekst{flex:1;min-height:0;overflow:hidden;line-height:1.22;color:#dcdce0}
.tekst .wit{height:.5em}
.cap{flex:none;margin-top:1.2vh;color:var(--zacht);font-size:clamp(12px,2vh,24px)}
.scores{flex:1;min-height:0;overflow:hidden;display:grid;column-gap:1.4em;align-content:start;justify-content:center}
.kol{min-width:0}
.regel{height:var(--lh);display:flex;align-items:center}
.regel.groep{align-items:flex-end;padding-bottom:.3em;color:var(--goud);font-size:.8em;letter-spacing:.04em;justify-content:center;white-space:nowrap}
.regel.groep span{color:var(--paars)}
.regel.groep i{font-style:normal;color:var(--zacht);margin-left:.5em}
.rij{flex:1;min-width:0;height:calc(var(--lh) - .3em);display:flex;align-items:center;gap:.6em;background:var(--vlak);border:1px solid transparent;border-radius:.4em;padding:0 .7em}
.rij.nieuw{border-color:var(--goud);background:#22201a}
.rij.leeg{background:none;border:1px dashed #3d3d43}
.rij.leeg .nr{color:#77777d}
.rij .nr{color:var(--goud);width:1.6em;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.rij .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rij .sc{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.rij .nw{font-size:.62em;color:var(--goud);margin-left:.5em}
.blz{flex:none;display:flex;gap:.7em;justify-content:center;align-items:center;height:3.6vh;min-height:24px;overflow:hidden;padding-top:.8vh;color:var(--zacht);font-size:clamp(11px,1.6vh,18px)}
.blz b{width:.7em;height:.7em;border-radius:50%;background:#3a3a3f;display:inline-block}
.blz b.aan{background:var(--goud)}
.leeg{color:var(--zacht);text-align:center;margin:auto;font-size:clamp(15px,2.8vh,34px);line-height:1.5;padding:0 6vw}
.midden .titel,.midden>.label,.midden .tekst,.midden .cap{text-align:center}
footer{text-align:center;padding:1vh 3vw;border-top:1px solid var(--lijn);color:var(--zacht);font-size:clamp(11px,1.7vh,20px)}
#balk{position:fixed;left:14px;bottom:14px;z-index:7;display:flex;align-items:center;gap:6px;background:rgba(18,18,21,.97);border:1px solid #3a3a3f;border-radius:10px;padding:7px 9px;font-size:14px;color:var(--zacht)}
#balk.uit,body.cast #balk{display:none}
#balk span{margin:0 2px 0 8px}
#balk span:first-child{margin-left:2px}
#balk button{background:#26262b;color:var(--tekst);border:1px solid #3a3a3f;border-radius:7px;min-width:38px;height:36px;padding:0 10px;font-size:15px;cursor:pointer;font-family:inherit}
#balk button:hover{border-color:var(--goud)}
#balk button.aan{background:var(--goud);color:#111;border-color:var(--goud)}
#balk button.teken{font-size:21px;font-weight:600;line-height:1}
@media (max-width:820px),(orientation:portrait){
  body{overflow:auto}
  #bord{height:auto;min-height:100vh;padding:0 !important}
  main.split{grid-template-columns:minmax(0,1fr) !important}
  main.split .vak+.vak{border-left:none;border-top:1px solid var(--lijn)}
  .tekst,.scores{overflow:visible;flex:none}
  .regel.groep{justify-content:flex-start}
  #klok{display:none}
  #balk{display:none}
}

<body>
<div id="bord">
  <header>
    <img src="img/logo-yp-2021.png" alt="YourProgram">
    <div id="kop"><b id="kop-titel">Live bord</b> <span id="kop-datum"></span> <span id="live">&#9679; live</span></div>
    <div id="klok"></div>
  </header>
  <main id="main"><div class="leeg">Bord laden…</div></main>
  <footer>Log je score in de YourProgram-app &middot; yourprogram.nl</footer>
</div>
<div id="balk" class="uit"></div>
<script>
const SUPABASE_URL="https://ujuvbxqgnxkyjcmcrqpw.supabase.co";
const SUPABASE_KEY="sb_publishable_e_959eiOehMLgZzfZDFiuQ_2UVK-z_c";
const CAST=location.pathname.replace(/\/+$/,"")==="/cast"; // op de Chromecast: de code komt van de telefoon
let CODE=new URLSearchParams(location.search).get("c")||"";
// ELKE_MS: zo vaak kijkt het bord of er iets veranderd is. Was 2 seconden; na de test met de
// Chromecast (20 nov 2026, Stefan: een paar seconden vertraging) een halve seconde. Eén aanvraag
// duurt ongeveer 80 ms en is klein. Lukt het ophalen niet, dan rustiger aan (FOUT_MS).
const ELKE_MS=500,FOUT_MS=2000,NIEUW_MS=25000,WISSEL_MS=12000;
const MAANDVOL=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const EENHEID={calories:"cal",meters:"m",km:"km",cm:"cm",watt:"W",rpm:"rpm",bpm:"bpm",spm:"spm"};
const komma=v=>String(v).replace(".",",");
const smalScherm=()=>window.matchMedia("(max-width:820px),(orientation:portrait)").matches;

// Zelfde regels als het leaderboard in de coach-app en de telefoon-app (weekworkout.js).
function scoreTxt(r,st){
  let t="";
  if(r.score_value!=null)t=komma(r.score_value)+(EENHEID[st]?" "+EENHEID[st]:"");
  else if(r.time_seconds!=null)t=Math.floor(r.time_seconds/60)+":"+pad(r.time_seconds%60);
  else if(r.load_kg!=null)t=komma(r.load_kg)+" kg";
  else if(r.rounds!=null)t=r.rounds+" rondes"+(r.reps!=null?" + "+r.reps:"");
  else if(r.reps!=null)t=r.reps+" reps";
  else t=r.score_text||"";
  return (r.capped?"CAP · ":"")+(t||"–");
}
function vergelijk(st){
  const n=(v,d)=>v==null?d:Number(v);
  return (a,b)=>{
    if(st==="time"){
      const ca=a.capped?1:0,cb=b.capped?1:0;if(ca!==cb)return ca-cb;
      if(ca)return (n(b.rounds,-1)-n(a.rounds,-1))||(n(b.reps,-1)-n(a.reps,-1));
      return n(a.time_seconds,1e15)-n(b.time_seconds,1e15);
    }
    if(st==="load")return n(b.load_kg,-1)-n(a.load_kg,-1);
    if(st==="reps")return n(b.reps,-1)-n(a.reps,-1);
    if(st==="rounds_reps")return (n(b.rounds,-1)-n(a.rounds,-1))||(n(b.reps,-1)-n(a.reps,-1));
    if(EENHEID[st])return n(b.score_value,-1e9)-n(a.score_value,-1e9);
    return new Date(a.created_at)-new Date(b.created_at);
  };
}
function datumNL(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");if(!m)return "";
  return Number(m[3])+" "+MAANDVOL[Number(m[2])-1]+" "+m[1];
}
// De opmaak: wat de coach in de coach-app instelt, met daaroverheen wat op dit scherm zelf is
// ingesteld. Alleen de workout-tekst (grootte, links of midden), de verdeling van het scherm
// en de rand zijn instelbaar; de scores deelt het bord zelf in.
// Dezelfde standaardwaarden als lvbOpmaak() in app/live-bord.js.
const lokaalSleutel=()=>"lvb_opmaak_"+CODE,serverSleutel=()=>"lvb_server_"+CODE;
let lokaal={};
function lokaalLaad(){lokaal={};try{const v=JSON.parse(localStorage.getItem(lokaalSleutel())||"{}");if(v&&typeof v==="object")lokaal=v;}catch(e){lokaal={};}}
lokaalLaad();
function lokaalBewaar(){try{localStorage.setItem(lokaalSleutel(),JSON.stringify(lokaal));}catch(e){}}
// Verandert de coach de opmaak via de afstandsbediening in de app of op de website, dan wint
// dat van wat eerder op dit scherm zelf was ingesteld: de eigen instelling van het scherm
// wordt gewist. Zo doet de afstandsbediening altijd wat de coach verwacht. De laatst geziene
// opmaak van de coach staat in het browsergeheugen, zodat verversen niets wist.
function serverOpmaak(s){
  try{
    const nu=JSON.stringify(s.opmaak||{}),vorig=localStorage.getItem(serverSleutel());
    if(vorig!==null&&vorig!==nu){lokaal={};localStorage.removeItem(lokaalSleutel());}
    if(vorig!==nu)localStorage.setItem(serverSleutel(),nu);
  }catch(e){}
}
function opmaakVan(s){
  const o=Object.assign({},(s&&s.opmaak)||{},lokaal),w=Number(o.workout);
  return {workout:w>=40&&w<=200?Math.round(w/10)*10:100,
    workoutPlek:(o.workoutPlek==="links"||o.workoutPlek==="midden")?o.workoutPlek:"",
    verdeling:["70","60","50"].includes(String(o.verdeling))?String(o.verdeling):"70",
    rand:Math.max(0,Math.min(8,Number(o.rand)||0))};
}
const VERDELING={"70":"minmax(0,7fr) minmax(0,3fr)","60":"minmax(0,6fr) minmax(0,4fr)","50":"minmax(0,1fr) minmax(0,1fr)"};
// Links of midden: wat gekozen is, en anders links naast de scores en in het midden als de tekst alleen staat.
const plekVan=(om,alleen)=>om.workoutPlek||(alleen?"midden":"links");
const staatAlleen=s=>!!(s&&s.onderdeel)&&(s.onderdeel.soort!=="workout"||s.weergave==="workout");

// Welke scores zijn nieuw sinds dit onderdeel op het bord kwam? Die krijgen even een gouden rand,
// en het bord bladert naar de bladzijde waar de nieuwe score staat.
let stand=null,vorige="",fouten=0,onderdeelId=null,gezien={},nieuwTot={},springNaar=null;
let pagina=0,aantalPag=1,laatsteWissel=Date.now(),pauze=false;
function merkNieuw(s){
  const o=s.onderdeel,oid=o?o.id:null,nu=Date.now();
  const eerste=oid!==onderdeelId;
  if(eerste){onderdeelId=oid;gezien={};nieuwTot={};pagina=0;laatsteWissel=nu;springNaar=null;}
  (s.scores||[]).forEach(r=>{
    const sleutel=r.id+"|"+scoreTxt(r,o&&o.score_type)+"|"+(r.rx||"");
    if(gezien[r.id]!==sleutel){
      if(!eerste){nieuwTot[r.id]=nu+NIEUW_MS;if(!springNaar)springNaar=r.id;}
      gezien[r.id]=sleutel;
    }
  });
}
// De scores als regels per stroom: mannen en vrouwen, elk met Rx en daaronder Scaled. Die vier
// vakken staan er altijd (wens Stefan); een vak met minder dan `vul` scores krijgt lege regels
// 1, 2, 3 zodat je ziet waar de scores komen. Scores zonder man/vrouw krijgen een eigen stroom
// "Overig", alleen als ze er zijn. Elke stroom krijgt zijn eigen kolom(men).
function stromenVan(s,vul){
  const o=s.onderdeel,st=(o&&o.score_type)||"text",rows=s.scores||[];
  const soort=r=>(r.gender==="man"||r.gender==="vrouw")?r.gender:"overig";
  return [["man","Mannen"],["vrouw","Vrouwen"],["overig","Overig"]].map(cat=>{
    const regels=[],vast=cat[0]!=="overig";
    ["rx","scaled"].forEach(rx=>{
      const g=rows.filter(r=>soort(r)===cat[0]&&(r.rx==="scaled"?"scaled":"rx")===rx).sort(vergelijk(st));
      if(!g.length&&!vast)return;
      g.forEach((r,i)=>regels.push({r,rang:i+1,groep:cat[0]+rx,naam:cat[1],rx}));
      for(let i=g.length+1;i<=(vast?vul:0);i++)regels.push({leeg:true,rang:i,groep:cat[0]+rx,naam:cat[1],rx});
    });
    return regels;
  }).filter(x=>x.length);
}
// Eén stroom opknippen in kolommen van hooguit R regels. Een kopje telt als regel; boven aan
// een kolom staat altijd het kopje van de groep die daar doorloopt.
function kolommenVan(regels,R){
  const kols=[];let kol=[],vorige=null;
  regels.forEach(l=>{
    const kop=kol.length===0||l.groep!==vorige;
    if(kol.length&&kol.length+(kop?2:1)>R){kols.push(kol);kol=[];}
    if(kol.length===0||l.groep!==vorige)kol.push({kop:true,naam:l.naam,rx:l.rx,vervolg:l.rang>1});
    kol.push(l);vorige=l.groep;
  });
  if(kol.length)kols.push(kol);
  return kols;
}
// Kolommen verdelen over bladzijden van K kolommen. Elke stroom krijgt evenveel kolommen per
// bladzijde, zodat mannen en vrouwen naast elkaar blijven staan en samen doorbladeren.
function bladzijden(perStroom,K){
  if(!perStroom.length)return [];
  // Kolommen per stroom: gelijk verdeeld, een kolom die overblijft gaat naar de eerste stroom(en).
  const n=perStroom.length,c=perStroom.map((k,i)=>Math.max(1,Math.floor(K/n)+(i<K%n&&K>n?1:0)));
  const diep=Math.max(...perStroom.map((k,i)=>Math.ceil(k.length/c[i]))),uit=[];
  for(let d=0;d<diep;d++){
    let laag=[];perStroom.forEach((k,i)=>{laag=laag.concat(k.slice(d*c[i],(d+1)*c[i]));});
    for(let i=0;i<laag.length;i+=K)uit.push(laag.slice(i,i+K));
  }
  return uit;
}
// De indeling kiest het bord zelf: de grootste letter waarbij alle scores op één scherm passen
// (met zo min mogelijk kolommen). Wordt de letter daarvoor te klein om van een afstand te
// lezen, dan blijft hij op de kleinste leesbare maat en bladert het bord door. Is er te
// weinig breedte om mannen en vrouwen naast elkaar te zetten, dan staan ze onder elkaar.
// Eerst met drie regels per vak (ook de lege); past dat niet, dan met één lege regel in een
// vak zonder scores. Bij bladeren staan mannen en vrouwen elk op een eigen bladzijde.
const REGEL=1.9; // regelhoogte in letters
function indeling(s,W,H){
  const vh=window.innerHeight,fMax=Math.round(vh*0.036),fMin=Math.max(14,Math.round(vh*0.022));
  const ruim=stromenVan(s,3),krap=stromenVan(s,1);
  const probeer=(stromen,f,bladeren)=>{
    const R=Math.max(3,Math.floor(H/(f*REGEL))),kMax=Math.max(1,Math.min(4,Math.floor((W+1.4*f)/(17.4*f))));
    let beste=null;
    for(let K=1;K<=kMax;K++){
      const samen=[[].concat(...stromen)];
      const sets=K<stromen.length?(bladeren?[stromen,samen]:[samen,stromen]):[stromen];
      for(const str of sets){
        const pags=bladzijden(str.map(x=>kolommenVan(x,R)),K);
        if(!beste||pags.length<beste.pags.length)beste={K,f,pags};
        if(pags.length<=1)return beste;
      }
    }
    return beste;
  };
  for(const stromen of [ruim,krap]){
    for(let f=fMax;f>=fMin;f--){const b=probeer(stromen,f,false);if(b.pags.length<=1)return b;}
  }
  return probeer(krap,fMin,true);
}
function vulScores(){
  const sc=document.getElementById("scores"),blz=document.getElementById("blz");
  if(!sc||!stand)return;
  const s=stand,st=(s.onderdeel&&s.onderdeel.score_type)||"text",nu=Date.now();
  let pags,f,lh,breed;
  if(smalScherm()){
    // Telefoon of staand scherm: alles onder elkaar, scrollen mag.
    pags=bladzijden([kolommenVan([].concat(...stromenVan(s,1)),100000)],1);f=16;lh=42;breed="minmax(0,1fr)";
  }else{
    const W=sc.clientWidth,H=sc.clientHeight,keuze=indeling(s,W,H);
    pags=keuze.pags;f=keuze.f;lh=f*REGEL;
    breed="repeat("+keuze.K+","+Math.floor(Math.min((W-(keuze.K-1)*1.4*f)/keuze.K,26*f))+"px)";
  }
  sc.style.fontSize=f+"px";sc.style.setProperty("--lh",lh+"px");sc.style.gridTemplateColumns=breed;
  aantalPag=pags.length||1;
  if(springNaar){
    const i=pags.findIndex(p=>p.some(k=>k.some(x=>x.r&&x.r.id===springNaar)));
    if(i>=0&&i!==pagina){pagina=i;laatsteWissel=nu;}
    springNaar=null;
  }
  if(pagina>=aantalPag)pagina=0;
  sc.innerHTML=(pags[pagina]||[]).map(k=>'<div class="kol">'+k.map(x=>{
    if(x.kop)return '<div class="regel groep"><div>'+esc(x.naam?x.naam+" / ":"")+(x.rx==="rx"?'Rx':'<span>Scaled</span>')+(x.vervolg?'<i>vervolg</i>':'')+'</div></div>';
    if(x.leeg)return '<div class="regel"><div class="rij leeg"><span class="nr">'+x.rang+'</span></div></div>';
    const r=x.r,nieuw=(nieuwTot[r.id]||0)>nu;
    return '<div class="regel"><div class="rij'+(nieuw?' nieuw':'')+'"><span class="nr">'+x.rang+'</span><span class="nm">'+esc(r.naam||"Naamloos")+
      (nieuw?'<span class="nw">nieuw</span>':'')+'</span><span class="sc">'+esc(scoreTxt(r,st))+'</span></div></div>';
  }).join("")+'</div>').join("");
  if(blz)blz.innerHTML=aantalPag>1?Array.from({length:aantalPag},(x,i)=>'<b'+(i===pagina?' class="aan"':'')+'></b>').join("")+'<span>'+(pagina+1)+' van '+aantalPag+(pauze?' · gepauzeerd':'')+'</span>':"";
}
// Meer scores dan er passen: om de paar seconden door naar de volgende bladzijde.
setInterval(()=>{
  if(!stand||aantalPag<2||pauze)return;
  if(Date.now()-laatsteWissel<WISSEL_MS)return;
  pagina=(pagina+1)%aantalPag;laatsteWissel=Date.now();vulScores();
},500);

// Workout-tekst: elke regel apart, een lege regel wordt een kleine tussenruimte. Zo groeit de
// ruimte tussen de regels niet mee als de letters groter worden.
function tekstHtml(t){
  let uit="",wit=false;
  String(t||"").replace(/\r/g,"").split("\n").forEach(regel=>{
    if(regel.trim()){uit+='<div>'+esc(regel)+'</div>';wit=false;}
    else if(uit&&!wit){uit+='<div class="wit"></div>';wit=true;}
  });
  return uit;
}
function workoutHtml(s,midden){
  const o=s.onderdeel;
  const cap=o.soort==="workout"&&o.score_type==="time"&&o.timecap?'<div class="cap">Tijdslimiet '+Math.floor(o.timecap/60)+":"+pad(o.timecap%60)+'</div>':'';
  return '<div class="vak'+(midden?' midden':'')+'"><div class="label">Onderdeel '+s.nr+' van '+s.aantal+'</div>'+
    '<h1 class="titel">'+esc(o.titel||"")+'</h1><div class="tekst" id="tekst">'+tekstHtml(o.tekst)+'</div>'+cap+'</div>';
}
function teken(){
  const main=document.getElementById("main"),s=stand;
  balkTeken();
  if(!s){main.className="";main.innerHTML='<div class="leeg">Dit bord bestaat niet (meer). Controleer de link.</div>';return;}
  document.getElementById("kop-titel").textContent=s.titel||"Live bord";
  document.getElementById("kop-datum").textContent=s.datum?"· "+datumNL(s.datum)+" ·":"·";
  document.title=(s.titel||"Live bord")+" · YourProgram";
  const o=s.onderdeel;
  if(!o){main.className="";main.innerHTML='<div class="leeg">Het bord staat klaar. Het eerste onderdeel verschijnt hier zo.</div>';return;}
  const om=opmaakVan(s),n=(s.scores||[]).length,alleen=staatAlleen(s),midden=plekVan(om,alleen)==="midden";
  const scoresVak=kop=>'<div class="vak'+(kop?' midden':'')+'">'+(kop?'<div class="label">Onderdeel '+s.nr+' van '+s.aantal+'</div><h1 class="titel">'+esc(o.titel||"")+'</h1>':'')+
    '<div class="label midden">Scores'+(n?' · '+n+' binnen':'')+'</div>'+
    '<div class="scores" id="scores"></div><div class="blz" id="blz"></div></div>';
  document.getElementById("bord").style.padding=om.rand?(om.rand+"vh "+om.rand+"vw"):"";
  main.style.gridTemplateColumns="";
  if(alleen){main.className="";main.innerHTML=workoutHtml(s,midden);}
  else if(s.weergave==="scores"){main.className="";main.innerHTML=scoresVak(true);}
  else{main.className="split";main.style.gridTemplateColumns=VERDELING[om.verdeling];main.innerHTML=workoutHtml(s,midden)+scoresVak(false);}
  pasAan();
}
// Workout-tekst: letters zo groot als ingesteld, maar alles moet in beeld passen (een tv scrolt niet).
function pas(el,max,min){
  if(!el)return;
  let f=max,n=0;el.style.fontSize=f+"px";
  while(f>min&&n++<120&&(el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)){f=Math.max(min,f*0.96);el.style.fontSize=f+"px";}
}
function pasAan(){
  const t=document.getElementById("tekst");
  if(smalScherm()){if(t)t.style.fontSize="17px";}
  else{
    const om=opmaakVan(stand),h=window.innerHeight*(1-om.rand/50),alleen=!document.getElementById("main").classList.contains("split");
    pas(t,Math.round(h*(alleen?0.06:0.046)*om.workout/100),12);
  }
  vulScores();
}
window.addEventListener("resize",()=>{if(stand)pasAan();});

let haalLoopt=false;
function startHalen(){if(haalLoopt||!CODE)return;haalLoopt=true;haal();}
async function haal(){
  const stop=new AbortController(),klok=setTimeout(()=>stop.abort(),8000);
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/live_bord_stand",{method:"POST",cache:"no-store",signal:stop.signal,
      headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({p_code:CODE})});
    if(!r.ok)throw new Error("http "+r.status);
    const s=await r.json();
    fouten=0;document.getElementById("live").className="";document.getElementById("live").innerHTML="&#9679; live";
    if(s){serverOpmaak(s);merkNieuw(s);}
    // Alleen opnieuw tekenen als er iets veranderd is, of als een gouden rand moet verlopen.
    const nu=Date.now(),actief=Object.keys(nieuwTot).filter(id=>nieuwTot[id]>nu).sort().join(",");
    const sleutel=JSON.stringify(s)+"#"+actief;
    if(sleutel!==vorige){vorige=sleutel;stand=s;teken();}
  }catch(e){
    fouten++;
    if(fouten>=3){const l=document.getElementById("live");l.className="weg";l.innerHTML="&#9679; geen verbinding";}
  }finally{clearTimeout(klok);setTimeout(haal,fouten?FOUT_MS:ELKE_MS);}
}
function tikKlok(){const d=new Date();document.getElementById("klok").textContent=pad(d.getHours())+":"+pad(d.getMinutes());}
tikKlok();setInterval(tikKlok,10000);

// Scherm wakker houden (waar de browser dat toestaat).
async function wakker(){try{if(navigator.wakeLock&&document.visibilityState==="visible")await navigator.wakeLock.request("screen");}catch(e){}}
document.addEventListener("visibilitychange",wakker);wakker();

// Het balkje linksonder (naar de tv van SugarWOD): letters kleiner en groter, links of midden,
// de verdeling van het scherm en volledig scherm. Het komt bij een muisbeweging of tik en is
// drie seconden later weer weg, net als de muisaanwijzer, zodat er niets blijft staan waar
// atleten naar kijken. Een klik werkt meteen en wordt op dit scherm onthouden.
const balk=document.getElementById("balk"),WEG_MS=3000;
let balkKlok=null,muisKlok=null;
function opnieuw(){if(stand)teken();else balkTeken();balkToon();}
function balkLetter(d){lokaal.workout=Math.max(40,Math.min(200,opmaakVan(stand).workout+d*10));lokaalBewaar();opnieuw();}
function balkZet(veld,waarde){lokaal[veld]=waarde;lokaalBewaar();opnieuw();}
function balkBlad(d){if(aantalPag<2)return;pagina=(pagina+d+aantalPag)%aantalPag;laatsteWissel=Date.now();vulScores();}
function balkPauze(){pauze=!pauze;laatsteWissel=Date.now();vulScores();}
function volKlik(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}}
function balkTeken(){
  const om=opmaakVan(stand),alleen=staatAlleen(stand),plek=plekVan(om,alleen),split=!!(stand&&stand.onderdeel)&&!alleen&&stand.weergave!=="scores";
  const keuze=(veld,nu,opties)=>opties.map(x=>'<button class="'+(nu===x[0]?"aan":"")+'" onclick="balkZet(\''+veld+'\',\''+x[0]+'\')" title="'+x[2]+'">'+x[1]+'</button>').join("");
  balk.innerHTML='<span>Letters</span><button class="teken" onclick="balkLetter(-1)" title="Workout-tekst kleiner">−</button><button class="teken" onclick="balkLetter(1)" title="Workout-tekst groter">+</button>'+
    '<span>Tekst</span>'+keuze("workoutPlek",plek,[["links","Links","Workout-tekst links"],["midden","Midden","Workout-tekst in het midden"]])+
    (split?'<span>Workout / scores</span>'+keuze("verdeling",om.verdeling,[["70","70 / 30","Workout 70 procent van het scherm, scores 30"],["60","60 / 40","Workout 60 procent, scores 40"],["50","50 / 50","Workout en scores even breed"]]):'')+
    (document.documentElement.requestFullscreen?'<span></span><button onclick="volKlik()">'+(document.fullscreenElement?"Volledig scherm uit":"Volledig scherm")+'</button>':'');
}
function balkToon(){
  balk.classList.remove("uit");document.documentElement.style.cursor="";
  clearTimeout(balkKlok);balkKlok=setTimeout(()=>{balk.classList.add("uit");},WEG_MS);
  clearTimeout(muisKlok);muisKlok=setTimeout(()=>{document.documentElement.style.cursor="none";},WEG_MS);
}
document.addEventListener("mousemove",balkToon,{passive:true});
document.addEventListener("touchstart",balkToon,{passive:true});
document.addEventListener("fullscreenchange",balkTeken);
// Toetsen voor wie ze kent: pijltjes bladeren door de scores, spatie pauzeert het bladeren.
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")balkBlad(1);else if(e.key==="ArrowLeft")balkBlad(-1);
  else if(e.key===" "){e.preventDefault();balkPauze();}
});
balkTeken();balkToon();

// ---------- Chromecast (app.yourprogram.nl/cast) ----------
const CAST_NS="urn:x-cast:nl.yourprogram.bord";
function castBord(code){
  code=String(code||"");
  if(!/^[0-9a-f]{12,40}$/.test(code)||code===CODE)return;
  CODE=code;lokaalLaad();
  stand=null;vorige="";onderdeelId=null;gezien={};nieuwTot={};pagina=0;
  document.getElementById("main").innerHTML='<div class="leeg">Bord laden…</div>';
  startHalen();
}
function startCast(){
  document.body.classList.add("cast");
  window.bordBericht=(m)=>{if(m&&m.type==="bord")castBord(m.code);return {type:"status",code:CODE};}; // testen zonder telefoon
  document.getElementById("main").innerHTML='<div class="leeg">Verbonden met de tv. Open in de app het Live bord, dan verschijnt het hier.</div>';
  const s=document.createElement("script");
  s.src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js";
  s.onload=()=>{
    const ctx=cast.framework.CastReceiverContext.getInstance();
    ctx.addCustomMessageListener(CAST_NS,(ev)=>{
      try{const m=ev.data||{};if(m.type==="bord")castBord(m.code);}catch(e){console.error(e);}
      try{ctx.sendCustomMessage(CAST_NS,ev.senderId,{type:"status",code:CODE,titel:stand?stand.titel:""});}catch(e){}
    });
    const opts=new cast.framework.CastReceiverOptions();
    opts.customNamespaces={[CAST_NS]:cast.framework.system.MessageType.JSON};
    opts.disableIdleTimeout=true; // geen video: anders sluit de Chromecast de pagina na een tijdje
    opts.skipPlayersLoad=true;
    opts.statusText="YourProgram Live bord";
    ctx.start(opts);
  };
  s.onerror=()=>{document.getElementById("main").innerHTML='<div class="leeg">De koppeling met de Chromecast kon niet laden. Controleer de internetverbinding van de tv.</div>';};
  document.head.appendChild(s);
}

if(CAST){startCast();if(CODE)startHalen();}
else if(!CODE){document.getElementById("main").innerHTML='<div class="leeg">Deze link is niet compleet. Kopieer de link van het bord opnieuw uit de coach-app.</div>';}
else startHalen();
</script>
