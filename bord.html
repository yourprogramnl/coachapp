<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>YourProgram · Live bord</title>
<!--
  Live bord (20 nov 2026, wens Stefan): de pagina die op een tv of beamer staat tijdens een
  trainingsdag. Open link met een geheime code (?c=...), zonder inloggen. Haalt elke twee
  seconden de stand op via de functie live_bord_stand: het onderdeel dat de coach nu toont
  en de scores daarbij. Het logo staat vast bovenaan, zodat het op elke foto staat.
  De scores staan als vaste, compacte regels in kolommen (naar het voorbeeld van de tv van
  SugarWOD): mannen en vrouwen elk in een eigen kolom, Rx en daaronder Scaled. Zijn er meer
  scores dan er passen, dan bladert het bord vanzelf door naar de volgende regels.
  Aanpassen kan ook op het scherm zelf: beweeg de muis (of tik) en onderaan komt een balk met
  dezelfde instellingen. Die werken meteen en gelden alleen voor dit scherm (browsergeheugen).
  Bediening en klaarzetten: app/live-bord.js in de coach-app.
-->
<style>
:root{--ink:#0E0E10;--vlak:#17171A;--lijn:#2a2a2e;--goud:#D9B44A;--tekst:#f2f2f2;--zacht:#9a9aa0;--groen:#6fcf8a;--rood:#e5484d;--paars:#b9a2ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--tekst);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
#bord{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{position:relative;text-align:center;padding:1.6vh 3vw 1.2vh;border-bottom:1px solid var(--lijn)}
header img{height:8.5vh;min-height:44px;max-width:80vw;object-fit:contain;display:block;margin:0 auto}
#kop{margin-top:.5vh;font-size:clamp(13px,2.1vh,26px);color:var(--zacht)}
#kop b{color:var(--tekst);font-weight:600}
#live{color:var(--groen);white-space:nowrap}
#live.weg{color:var(--rood)}
#klok{position:absolute;right:3vw;top:50%;transform:translateY(-50%);font-size:clamp(16px,3.6vh,44px);font-variant-numeric:tabular-nums;color:var(--zacht)}
main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
main.split{grid-template-columns:minmax(0,42fr) minmax(0,58fr)}
.vak{min-height:0;min-width:0;padding:2.2vh 2.4vw;display:flex;flex-direction:column}
main.split .vak+.vak{border-left:1px solid var(--lijn)}
.label{color:var(--goud);font-size:clamp(12px,1.9vh,22px);letter-spacing:.04em;margin-bottom:.8vh;flex:none}
.label.midden{text-align:center}
.titel{font-size:clamp(20px,4.2vh,54px);font-weight:700;line-height:1.15;margin:0 0 1.4vh;flex:none}
.tekst{flex:1;min-height:0;overflow:hidden;white-space:pre-wrap;line-height:1.45;color:#dcdce0}
.cap{flex:none;margin-top:1.2vh;color:var(--zacht);font-size:clamp(12px,2vh,24px)}
.scores{flex:1;min-height:0;overflow:hidden;display:grid;column-gap:1.4em;align-content:start;justify-content:start}
.scores.midden{justify-content:center}
.kol{min-width:0}
.regel{height:var(--lh);display:flex;align-items:center}
.regel.groep{align-items:flex-end;padding-bottom:.3em;color:var(--goud);font-size:.8em;letter-spacing:.04em;justify-content:center;white-space:nowrap}
.regel.groep span{color:var(--paars)}
.regel.groep i{font-style:normal;color:var(--zacht);margin-left:.5em}
.rij{flex:1;min-width:0;height:calc(var(--lh) - .3em);display:flex;align-items:center;gap:.6em;background:var(--vlak);border:1px solid transparent;border-radius:.4em;padding:0 .7em}
.rij.nieuw{border-color:var(--goud);background:#22201a}
.rij .nr{color:var(--goud);width:1.6em;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.rij .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rij .sc{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.rij .nw{font-size:.62em;color:var(--goud);margin-left:.5em}
.blz{flex:none;display:flex;gap:.7em;justify-content:center;align-items:center;height:3.6vh;min-height:24px;overflow:hidden;padding-top:.8vh;color:var(--zacht);font-size:clamp(11px,1.6vh,18px)}
.blz b{width:.7em;height:.7em;border-radius:50%;background:#3a3a3f;display:inline-block}
.blz b.aan{background:var(--goud)}
.leeg{color:var(--zacht);text-align:center;margin:auto;font-size:clamp(15px,2.8vh,34px);line-height:1.5;padding:0 6vw}
.alleen .titel,.alleen .label{text-align:center}
.alleen .tekst{text-align:center}
footer{text-align:center;padding:1vh 3vw;border-top:1px solid var(--lijn);color:var(--zacht);font-size:clamp(11px,1.7vh,20px)}
#balk{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(23,23,26,.97);border-top:1px solid var(--goud);padding:9px 14px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:center;font-size:14px;color:var(--tekst);transition:opacity .35s}
#balk.uit{opacity:0;pointer-events:none}
#balk .g{display:flex;align-items:center;gap:6px;white-space:nowrap}
#balk .g>span{color:var(--zacht)}
#balk .g>b{min-width:2.8em;text-align:center}
#balk button{background:#26262b;color:var(--tekst);border:1px solid #3a3a3f;border-radius:7px;min-width:34px;height:34px;padding:0 10px;font-size:15px;cursor:pointer;font-family:inherit}
#balk button:hover{border-color:var(--goud)}
#balk button.aan{background:var(--goud);color:#111;border-color:var(--goud)}
#balk button:disabled{opacity:.4;cursor:default;border-color:#3a3a3f}
@media (max-width:820px),(orientation:portrait){
  body{overflow:auto}
  #bord{height:auto;min-height:100vh;padding:0 !important}
  main.split{grid-template-columns:minmax(0,1fr) !important}
  main.split .vak+.vak{border-left:none;border-top:1px solid var(--lijn)}
  .tekst,.scores{overflow:visible;flex:none}
  .regel.groep{justify-content:flex-start}
  #klok{display:none}
  #balk{display:none}
}
</style>
</head>
<body>
<div id="bord">
  <header>
    <img src="img/logo-yp-2021.png" alt="YourProgram">
    <div id="kop"><b id="kop-titel">Live bord</b> <span id="kop-datum"></span> <span id="live">&#9679; live</span></div>
    <div id="klok"></div>
  </header>
  <main id="main"><div class="leeg">Bord laden…</div></main>
  <footer>Log je score in de YourProgram-app &middot; yourprogram.nl</footer>
</div>
<div id="balk" class="uit"></div>
<script>
const SUPABASE_URL="https://ujuvbxqgnxkyjcmcrqpw.supabase.co";
const SUPABASE_KEY="sb_publishable_e_959eiOehMLgZzfZDFiuQ_2UVK-z_c";
const CODE=new URLSearchParams(location.search).get("c")||"";
const ELKE_MS=2000,NIEUW_MS=25000;
const MAANDVOL=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const EENHEID={calories:"cal",meters:"m",km:"km",cm:"cm",watt:"W",rpm:"rpm",bpm:"bpm",spm:"spm"};
const komma=v=>String(v).replace(".",",");
const smalScherm=()=>window.matchMedia("(max-width:820px),(orientation:portrait)").matches;

// Zelfde regels als het leaderboard in de coach-app en de telefoon-app (weekworkout.js).
function scoreTxt(r,st){
  let t="";
  if(r.score_value!=null)t=komma(r.score_value)+(EENHEID[st]?" "+EENHEID[st]:"");
  else if(r.time_seconds!=null)t=Math.floor(r.time_seconds/60)+":"+pad(r.time_seconds%60);
  else if(r.load_kg!=null)t=komma(r.load_kg)+" kg";
  else if(r.rounds!=null)t=r.rounds+" rondes"+(r.reps!=null?" + "+r.reps:"");
  else if(r.reps!=null)t=r.reps+" reps";
  else t=r.score_text||"";
  return (r.capped?"CAP · ":"")+(t||"–");
}
function vergelijk(st){
  const n=(v,d)=>v==null?d:Number(v);
  return (a,b)=>{
    if(st==="time"){
      const ca=a.capped?1:0,cb=b.capped?1:0;if(ca!==cb)return ca-cb;
      if(ca)return (n(b.rounds,-1)-n(a.rounds,-1))||(n(b.reps,-1)-n(a.reps,-1));
      return n(a.time_seconds,1e15)-n(b.time_seconds,1e15);
    }
    if(st==="load")return n(b.load_kg,-1)-n(a.load_kg,-1);
    if(st==="reps")return n(b.reps,-1)-n(a.reps,-1);
    if(st==="rounds_reps")return (n(b.rounds,-1)-n(a.rounds,-1))||(n(b.reps,-1)-n(a.reps,-1));
    if(EENHEID[st])return n(b.score_value,-1e9)-n(a.score_value,-1e9);
    return new Date(a.created_at)-new Date(b.created_at);
  };
}
function datumNL(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");if(!m)return "";
  return Number(m[3])+" "+MAANDVOL[Number(m[2])-1]+" "+m[1];
}
// De opmaak die de coach per bord instelt (kolommen, regels, links of midden, verdeling, rand).
// Dezelfde standaardwaarden als lvbOpmaak() in app/live-bord.js.
const LOKAAL_SLEUTEL="lvb_opmaak_"+CODE;
let lokaal={};
try{const v=JSON.parse(localStorage.getItem(LOKAAL_SLEUTEL)||"{}");if(v&&typeof v==="object")lokaal=v;}catch(e){lokaal={};}
function lokaalBewaar(){try{localStorage.setItem(LOKAAL_SLEUTEL,JSON.stringify(lokaal));}catch(e){}}
function opmaakVan(s){
  const o=Object.assign({},(s&&s.opmaak)||{},lokaal),pct=v=>{v=Number(v);return v>=40&&v<=160?v/100:1;};
  const heel=(v,min,max,std)=>{v=Math.round(Number(v));return v>=min&&v<=max?v:std;};
  return {kolommen:heel(o.kolommen,1,4,2),regels:heel(o.regels,5,20,10),wissel:heel(o.wissel,5,60,15),
    workout:pct(o.workout),scoresPlek:o.scoresPlek==="links"?"links":"midden",workoutPlek:o.workoutPlek==="midden"?"midden":"links",
    verdeling:(o.verdeling==="smal"||o.verdeling==="half")?o.verdeling:"normaal",rand:Math.max(0,Math.min(8,Number(o.rand)||0))};
}
const VERDELING={smal:"minmax(0,33fr) minmax(0,67fr)",normaal:"minmax(0,42fr) minmax(0,58fr)",half:"minmax(0,1fr) minmax(0,1fr)"};

// Welke scores zijn nieuw sinds dit onderdeel op het bord kwam? Die krijgen even een gouden rand,
// en het bord bladert naar de bladzijde waar de nieuwe score staat.
let stand=null,vorige="",fouten=0,onderdeelId=null,gezien={},nieuwTot={},springNaar=null;
let pagina=0,aantalPag=1,laatsteWissel=Date.now(),pauze=false;
function merkNieuw(s){
  const o=s.onderdeel,oid=o?o.id:null,nu=Date.now();
  const eerste=oid!==onderdeelId;
  if(eerste){onderdeelId=oid;gezien={};nieuwTot={};pagina=0;laatsteWissel=nu;springNaar=null;}
  (s.scores||[]).forEach(r=>{
    const sleutel=r.id+"|"+scoreTxt(r,o&&o.score_type)+"|"+(r.rx||"");
    if(gezien[r.id]!==sleutel){
      if(!eerste){nieuwTot[r.id]=nu+NIEUW_MS;if(!springNaar)springNaar=r.id;}
      gezien[r.id]=sleutel;
    }
  });
}
// De scores als regels per stroom: mannen, vrouwen en (zonder man/vrouw) overig. Binnen een
// stroom eerst Rx en daaronder Scaled. Elke stroom krijgt zijn eigen kolom(men).
function stromenVan(s){
  const o=s.onderdeel,st=(o&&o.score_type)||"text",rows=s.scores||[];
  const soort=r=>(r.gender==="man"||r.gender==="vrouw")?r.gender:"overig";
  const metGeslacht=rows.some(r=>soort(r)!=="overig");
  return [["man","Mannen"],["vrouw","Vrouwen"],["overig",metGeslacht?"Overig":""]].map(cat=>{
    const regels=[];
    ["rx","scaled"].forEach(rx=>{
      rows.filter(r=>soort(r)===cat[0]&&(r.rx==="scaled"?"scaled":"rx")===rx).sort(vergelijk(st))
        .forEach((r,i)=>regels.push({r,rang:i+1,groep:cat[0]+rx,naam:cat[1],rx}));
    });
    return regels;
  }).filter(x=>x.length);
}
// Eén stroom opknippen in kolommen van hooguit R regels. Een kopje telt als regel; boven aan
// een kolom staat altijd het kopje van de groep die daar doorloopt.
function kolommenVan(regels,R){
  const kols=[];let kol=[],vorige=null;
  regels.forEach(l=>{
    const kop=kol.length===0||l.groep!==vorige;
    if(kol.length&&kol.length+(kop?2:1)>R){kols.push(kol);kol=[];}
    if(kol.length===0||l.groep!==vorige)kol.push({kop:true,naam:l.naam,rx:l.rx,vervolg:l.rang>1});
    kol.push(l);vorige=l.groep;
  });
  if(kol.length)kols.push(kol);
  return kols;
}
// Kolommen verdelen over bladzijden van K kolommen. Elke stroom krijgt evenveel kolommen per
// bladzijde, zodat mannen en vrouwen naast elkaar blijven staan en samen doorbladeren.
function bladzijden(perStroom,K){
  if(!perStroom.length)return [];
  // Kolommen per stroom: gelijk verdeeld, een kolom die overblijft gaat naar de eerste stroom(en).
  const n=perStroom.length,c=perStroom.map((k,i)=>Math.max(1,Math.floor(K/n)+(i<K%n&&K>n?1:0)));
  const diep=Math.max(...perStroom.map((k,i)=>Math.ceil(k.length/c[i]))),uit=[];
  for(let d=0;d<diep;d++){
    let laag=[];perStroom.forEach((k,i)=>{laag=laag.concat(k.slice(d*c[i],(d+1)*c[i]));});
    for(let i=0;i<laag.length;i+=K)uit.push(laag.slice(i,i+K));
  }
  return uit;
}
function vulScores(){
  const sc=document.getElementById("scores"),blz=document.getElementById("blz");
  if(!sc||!stand)return;
  const s=stand,st=(s.onderdeel&&s.onderdeel.score_type)||"text",om=opmaakVan(s),nu=Date.now(),smal=smalScherm();
  const K=smal?1:om.kolommen,R=smal?100000:om.regels;
  let lh,f,breed;
  if(smal){lh=42;f=16;breed="minmax(0,1fr)";}
  else{
    const W=sc.clientWidth,H=sc.clientHeight;
    lh=H/R;
    // Letter: de helft van de regelhoogte, maar een kolom moet minstens zo'n 15 letters breed blijven.
    f=Math.max(9,Math.min(lh*0.5,W/K/16));
    breed=Math.floor(Math.min((W-(K-1)*1.4*f)/K,26*f))+"px";
  }
  sc.style.fontSize=f+"px";sc.style.setProperty("--lh",lh+"px");
  sc.style.gridTemplateColumns="repeat("+K+","+breed+")";
  sc.classList.toggle("midden",om.scoresPlek==="midden");
  const pags=bladzijden(stromenVan(s).map(x=>kolommenVan(x,R)),K);
  aantalPag=pags.length||1;
  if(springNaar){
    const i=pags.findIndex(p=>p.some(k=>k.some(x=>x.r&&x.r.id===springNaar)));
    if(i>=0&&i!==pagina){pagina=i;laatsteWissel=nu;}
    springNaar=null;
  }
  if(pagina>=aantalPag)pagina=0;
  sc.innerHTML=(pags[pagina]||[]).map(k=>'<div class="kol">'+k.map(x=>{
    if(x.kop)return '<div class="regel groep"><div>'+esc(x.naam?x.naam+" / ":"")+(x.rx==="rx"?'Rx':'<span>Scaled</span>')+(x.vervolg?'<i>vervolg</i>':'')+'</div></div>';
    const r=x.r,nieuw=(nieuwTot[r.id]||0)>nu;
    return '<div class="regel"><div class="rij'+(nieuw?' nieuw':'')+'"><span class="nr">'+x.rang+'</span><span class="nm">'+esc(r.naam||"Naamloos")+
      (nieuw?'<span class="nw">nieuw</span>':'')+'</span><span class="sc">'+esc(scoreTxt(r,st))+'</span></div></div>';
  }).join("")+'</div>').join("");
  if(blz)blz.innerHTML=aantalPag>1?Array.from({length:aantalPag},(x,i)=>'<b'+(i===pagina?' class="aan"':'')+'></b>').join("")+'<span>'+(pagina+1)+' van '+aantalPag+(pauze?' · gepauzeerd':'')+'</span>':"";
}
// Meer scores dan er passen: elke paar seconden (instelbaar) door naar de volgende bladzijde.
setInterval(()=>{
  if(!stand||aantalPag<2||pauze)return;
  if(Date.now()-laatsteWissel<opmaakVan(stand).wissel*1000)return;
  pagina=(pagina+1)%aantalPag;laatsteWissel=Date.now();vulScores();
},500);

function workoutHtml(s,midden){
  const o=s.onderdeel;
  const cap=o.soort==="workout"&&o.score_type==="time"&&o.timecap?'<div class="cap">Tijdslimiet '+Math.floor(o.timecap/60)+":"+pad(o.timecap%60)+'</div>':'';
  return '<div class="vak'+(midden?' alleen':'')+'"><div class="label">Onderdeel '+s.nr+' van '+s.aantal+'</div>'+
    '<h1 class="titel">'+esc(o.titel||"")+'</h1><div class="tekst" id="tekst">'+esc(o.tekst||"")+'</div>'+cap+'</div>';
}
function teken(){
  const main=document.getElementById("main"),s=stand;
  balkTeken();
  if(!s){main.className="";main.innerHTML='<div class="leeg">Dit bord bestaat niet (meer). Controleer de link.</div>';return;}
  document.getElementById("kop-titel").textContent=s.titel||"Live bord";
  document.getElementById("kop-datum").textContent=s.datum?"· "+datumNL(s.datum)+" ·":"·";
  document.title=(s.titel||"Live bord")+" · YourProgram";
  const o=s.onderdeel;
  if(!o){main.className="";main.innerHTML='<div class="leeg">Het bord staat klaar. Het eerste onderdeel verschijnt hier zo.</div>';return;}
  const om=opmaakVan(s),n=(s.scores||[]).length,mid=om.scoresPlek==="midden"?" midden":"";
  const scoresVak=kop=>'<div class="vak'+(kop?' alleen':'')+'">'+(kop?'<div class="label">Onderdeel '+s.nr+' van '+s.aantal+'</div><h1 class="titel">'+esc(o.titel||"")+'</h1>':'')+
    '<div class="label'+mid+'">Scores'+(n?' · '+n+' binnen':'')+'</div>'+
    (n?'<div class="scores" id="scores"></div><div class="blz" id="blz"></div>':'<div class="leeg">Nog geen scores. Log je score in de app, dan staat hij hier meteen.</div>')+'</div>';
  document.getElementById("bord").style.padding=om.rand?(om.rand+"vh "+om.rand+"vw"):"";
  main.style.gridTemplateColumns="";
  if(o.soort!=="workout"||s.weergave==="workout"){main.className="";main.innerHTML=workoutHtml(s,true);}
  else if(s.weergave==="scores"){main.className="";main.innerHTML=scoresVak(true);}
  else{main.className="split";main.style.gridTemplateColumns=VERDELING[om.verdeling];main.innerHTML=workoutHtml(s,om.workoutPlek==="midden")+scoresVak(false);}
  pasAan();
}
// Workout-tekst: letters zo groot mogelijk, maar alles moet in beeld passen (een tv scrolt niet).
function pas(el,max,min){
  if(!el)return;
  let f=max,n=0;el.style.fontSize=f+"px";
  while(f>min&&n++<80&&(el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)){f=Math.max(min,f*0.95);el.style.fontSize=f+"px";}
}
function pasAan(){
  const t=document.getElementById("tekst");
  if(smalScherm()){if(t)t.style.fontSize="17px";}
  else{
    const om=opmaakVan(stand),h=window.innerHeight*(1-om.rand/50),alleen=!document.getElementById("main").classList.contains("split");
    pas(t,Math.round(h*(alleen?0.06:0.043)*om.workout),12);
  }
  vulScores();
}
window.addEventListener("resize",()=>{if(stand)pasAan();});

async function haal(){
  const stop=new AbortController(),klok=setTimeout(()=>stop.abort(),8000);
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/live_bord_stand",{method:"POST",cache:"no-store",signal:stop.signal,
      headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({p_code:CODE})});
    if(!r.ok)throw new Error("http "+r.status);
    const s=await r.json();
    fouten=0;document.getElementById("live").className="";document.getElementById("live").innerHTML="&#9679; live";
    if(s)merkNieuw(s);
    // Alleen opnieuw tekenen als er iets veranderd is, of als een gouden rand moet verlopen.
    const nu=Date.now(),actief=Object.keys(nieuwTot).filter(id=>nieuwTot[id]>nu).sort().join(",");
    const sleutel=JSON.stringify(s)+"#"+actief;
    if(sleutel!==vorige){vorige=sleutel;stand=s;teken();}
  }catch(e){
    fouten++;
    if(fouten>=3){const l=document.getElementById("live");l.className="weg";l.innerHTML="&#9679; geen verbinding";}
  }finally{clearTimeout(klok);setTimeout(haal,ELKE_MS);}
}
function tikKlok(){const d=new Date();document.getElementById("klok").textContent=pad(d.getHours())+":"+pad(d.getMinutes());}
tikKlok();setInterval(tikKlok,10000);

// Scherm wakker houden (waar de browser dat toestaat).
async function wakker(){try{if(navigator.wakeLock&&document.visibilityState==="visible")await navigator.wakeLock.request("screen");}catch(e){}}
document.addEventListener("visibilitychange",wakker);wakker();

// Instelbalk op het scherm zelf (20 nov 2026, wens Stefan, zoals de tv van SugarWOD): beweeg de
// muis of tik en de balk komt onderaan in beeld. Een wijziging werkt meteen, zonder omweg via
// de database, en wordt op dit scherm onthouden. "Standaard" gaat terug naar wat de coach in
// de coach-app heeft ingesteld.
const STAP={kolommen:[1,4,1],regels:[5,20,1],wissel:[5,60,5],workout:[40,160,10],rand:[0,8,1]};
const balk=document.getElementById("balk");let balkKlok=null,balkOver=false;
function nuWaarde(veld){const om=opmaakVan(stand);return veld==="workout"?Math.round(om.workout*100):om[veld];}
function opnieuw(){if(stand)teken();else balkTeken();balkToon();}
function balkStap(veld,d){const g=STAP[veld];lokaal[veld]=Math.max(g[0],Math.min(g[1],nuWaarde(veld)+d*g[2]));lokaalBewaar();opnieuw();}
function balkZet(veld,waarde){lokaal[veld]=waarde;lokaalBewaar();opnieuw();}
function balkTerug(){lokaal={};try{localStorage.removeItem(LOKAAL_SLEUTEL);}catch(e){}opnieuw();}
function balkBlad(d){if(aantalPag<2)return;pagina=(pagina+d+aantalPag)%aantalPag;laatsteWissel=Date.now();vulScores();balkToon();}
function balkPauze(){pauze=!pauze;laatsteWissel=Date.now();balkTeken();vulScores();balkToon();}
function volKlik(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}}
function balkTeken(){
  const om=opmaakVan(stand);
  const stap=(naam,veld,tekst)=>'<div class="g"><span>'+naam+'</span><button onclick="balkStap(\''+veld+'\',-1)">−</button><b>'+tekst+'</b><button onclick="balkStap(\''+veld+'\',1)">+</button></div>';
  const keuze=(naam,veld,opties)=>'<div class="g"><span>'+naam+'</span>'+opties.map(x=>'<button class="'+(om[veld]===x[0]?"aan":"")+'" onclick="balkZet(\''+veld+'\',\''+x[0]+'\')">'+x[1]+'</button>').join("")+'</div>';
  balk.innerHTML=stap("Kolommen","kolommen",om.kolommen)+stap("Regels","regels",om.regels)+
    keuze("Scores","scoresPlek",[["links","Links"],["midden","Midden"]])+
    stap("Tekst","workout",Math.round(om.workout*100)+"%")+keuze("Tekst","workoutPlek",[["links","Links"],["midden","Midden"]])+
    keuze("Verdeling","verdeling",[["smal","Smal"],["normaal","Normaal"],["half","Half"]])+
    stap("Rand","rand",om.rand?String(om.rand):"geen")+
    '<div class="g"><span>Bladeren</span><button onclick="balkBlad(-1)" title="Vorige bladzijde"'+(aantalPag<2?' disabled':'')+'>‹</button>'+
      '<button class="'+(pauze?"aan":"")+'" onclick="balkPauze()">'+(pauze?"Verder":"Pauze")+'</button>'+
      '<button onclick="balkBlad(1)" title="Volgende bladzijde"'+(aantalPag<2?' disabled':'')+'>›</button></div>'+
    stap("Wissel","wissel",om.wissel+" s")+
    '<div class="g"><button onclick="balkTerug()"'+(Object.keys(lokaal).length?'':' disabled')+' title="Terug naar de instelling uit de coach-app">Standaard</button>'+
      (document.documentElement.requestFullscreen?'<button onclick="volKlik()">'+(document.fullscreenElement?"Volledig scherm uit":"Volledig scherm")+'</button>':'')+'</div>';
}
function balkToon(){
  balk.classList.remove("uit");clearTimeout(balkKlok);
  balkKlok=setTimeout(()=>{if(balkOver){balkToon();return;}balk.classList.add("uit");},6000);
}
balk.addEventListener("mouseenter",()=>{balkOver=true;});
balk.addEventListener("mouseleave",()=>{balkOver=false;});
document.addEventListener("touchstart",()=>{balkOver=false;},{passive:true});
["mousemove","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,balkToon,{passive:true}));
document.addEventListener("fullscreenchange",balkTeken);
// Toetsen: pijltjes bladeren, spatie pauzeert.
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")balkBlad(1);else if(e.key==="ArrowLeft")balkBlad(-1);
  else if(e.key===" "){e.preventDefault();balkPauze();}
});
balkTeken();balkToon();

if(!CODE){document.getElementById("main").innerHTML='<div class="leeg">Deze link is niet compleet. Kopieer de link van het bord opnieuw uit de coach-app.</div>';}
else haal();
</script>
</body>
</html>
